<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>網站音量倍率</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
      color: #172033;
      background: #f3f6fb;
    }

    * { box-sizing: border-box; }

    body {
      width: 370px;
      min-height: 250px;
      margin: 0;
      padding: 16px;
      background: linear-gradient(160deg, #eef4ff 0%, #f8fafc 48%, #f4f1ff 100%);
    }

    h1, h2, p { margin: 0; }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    h1 { font-size: 17px; }
    h2 { font-size: 13px; color: #526078; }

    .card {
      padding: 14px;
      border: 1px solid rgba(124, 145, 180, 0.24);
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 8px 24px rgba(51, 65, 85, 0.08);
    }

    .site-name {
      margin-bottom: 12px;
      overflow: hidden;
      color: #34435c;
      font-size: 13px;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .volume-row {
      display: grid;
      grid-template-columns: 1fr 64px 14px;
      align-items: center;
      gap: 8px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #5b5bd6;
      cursor: pointer;
    }

    input[type="number"] {
      width: 64px;
      padding: 7px 6px;
      border: 1px solid #cad3e2;
      border-radius: 8px;
      background: #fff;
      color: #172033;
      text-align: right;
    }

    button {
      border: 0;
      border-radius: 8px;
      font: inherit;
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid #5b5bd6;
      outline-offset: 2px;
    }

    .status {
      min-height: 18px;
      margin-top: 8px;
      color: #64748b;
      font-size: 11px;
    }

    .history-section { margin-top: 14px; }

    .history-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .clear-all {
      padding: 4px 7px;
      background: transparent;
      color: #7c3aed;
      font-size: 11px;
    }

    .history-list {
      display: flex;
      max-height: 210px;
      overflow-y: auto;
      flex-direction: column;
      gap: 7px;
    }

    .history-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 8px;
      padding: 9px 10px;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.72);
    }

    .history-site {
      overflow: hidden;
      font-size: 12px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-time {
      margin-top: 2px;
      color: #8490a5;
      font-size: 10px;
    }

    .history-volume {
      color: #4f46e5;
      font-size: 12px;
      font-weight: 700;
    }

    .delete-record {
      width: 24px;
      height: 24px;
      background: #f1f5f9;
      color: #64748b;
      line-height: 24px;
    }

    .empty-state {
      padding: 18px 8px;
      color: #7b879c;
      font-size: 12px;
      text-align: center;
    }

    .unsupported {
      color: #a43b3b;
    }

    input:disabled { cursor: not-allowed; opacity: 0.55; }
    .subtitle { margin: 5px 0 15px; color: #64748b; font-size: 12px; line-height: 1.6; }
    .factor-label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 7px; }
    .metrics { display: grid; grid-template-columns: 1fr 16px 1fr 16px 1fr; align-items: center; text-align: center; margin-top: 16px; padding-top: 14px; border-top: 1px solid #e3e6f1; }
    .metric-label { display: block; font-size: 10px; color: #64748b; margin-bottom: 5px; }
    .metric-value { display: block; font-size: 19px; font-weight: 650; color: #334155; }
    #outputReadout { color: #5b5bd6; }
    .operator { color: #94a3b8; }
    #playbackState { margin-top: 10px; color: #64748b; font-size: 11px; line-height: 1.6; }
    #resetSite { padding: 6px 10px; margin-top: 10px; color: #5b5bd6; background: #efefff; font-size: 12px; }
    #zeroHint { margin-top: 10px; font-size: 12px; color: #a55216; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="header">
    <h1>網站音量倍率</h1>
    <span style="font-size:11px;color:#64748b">v5.0</span>
  </div>
  <p class="subtitle">先把太大聲的網站調低，再用網頁滑桿微調。</p>

  <section class="card" aria-labelledby="currentSite">
    <div class="site-name" id="currentSite">讀取目前網站中…</div>
    <label class="factor-label" for="factorInput">網站倍率（100% 為原音量）</label>
    <div class="volume-row">
      <input type="range" id="factorSlider" min="0" max="100" value="100" aria-label="網站倍率" disabled>
      <input type="number" id="factorInput" min="0" max="100" value="100" aria-label="網站倍率百分比" disabled>
      <span>%</span>
    </div>
    <button type="button" id="resetSite" disabled>恢復 100%</button>
    <p class="status" id="status" aria-live="polite"></p>
    <p id="zeroHint" hidden>網站倍率為 0%，已靜音。提高倍率後，網頁滑桿才會有聲音。</p>
    <div class="metrics" aria-label="目前音量計算">
      <div><span class="metric-label">播放器</span><span class="metric-value" id="playerReadout">—</span></div>
      <span class="operator">×</span>
      <div><span class="metric-label">網站倍率</span><span class="metric-value" id="factorReadout">100%</span></div>
      <span class="operator">=</span>
      <div><span class="metric-label">目前輸出</span><span class="metric-value" id="outputReadout">—</span></div>
    </div>
    <p id="playbackState"></p>
  </section>

  <section class="history-section" aria-labelledby="historyTitle">
    <div class="history-heading">
      <h2 id="historyTitle">已記住的網站倍率</h2>
      <button type="button" class="clear-all" id="clearAll">清除全部</button>
    </div>
    <div class="history-list" id="historyList"></div>
  </section>

  <script src="popup.js"></script>
</body>
</html>
